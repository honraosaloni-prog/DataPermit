<style>
:root{
  --bg:#F5F6F7;
  --panel:#FFFFFF;
  --border:#DEE1E6;
  --border-strong:#C7CBD3;
  --text:#14181F;
  --text-dim:#5B6472;
  --text-faint:#88909A;
  --sidebar:#171B22;
  --sidebar-text:#B7BEC9;
  --sidebar-text-dim:#6C7482;
  --sidebar-active:#232936;
  --accent:#2B6CB5;
  --accent-soft:#E4EEF8;
  --green:#2F8F5B;
  --green-soft:#E5F3EA;
  --amber:#B8791A;
  --amber-soft:#FBF0DD;
  --red:#C0392B;
  --red-soft:#FBE8E5;
  --mono: ui-monospace, SFMono-Regular, "IBM Plex Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
[data-theme="dark"]{
  --bg:#14171C;
  --panel:#1B1F26;
  --border:#2B303A;
  --border-strong:#3A404C;
  --text:#E7E9EC;
  --text-dim:#9AA2AF;
  --text-faint:#6B7280;
  --sidebar:#0E1015;
  --sidebar-active:#1E2430;
  --accent-soft:#1C3352;
  --green-soft:#123321;
  --amber-soft:#3A2C0E;
  --red-soft:#3A1815;
}
[data-theme="dark"] th{ background:#20242C; }
[data-theme="dark"] .sample-chip{ background:#20242C; }
[data-theme="dark"] .compare-head.orig{ background:var(--red-soft); }
[data-theme="dark"] .compare-head.prot{ background:var(--green-soft); }
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--sans);cursor:pointer;}
input,select{font-family:var(--sans);}
::selection{background:var(--accent-soft);}

.app{display:flex;height:100vh;overflow:hidden;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:212px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;padding:16px 10px;}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px 8px;}
.brand-mark{width:22px;height:22px;flex-shrink:0;}
.brand-name{font-weight:700;font-size:14px;letter-spacing:0.2px;color:#fff;}
.brand-tag{font-size:9.5px;color:var(--sidebar-text-dim);margin-top:1px;}
.nav-group{margin-top:14px;}
.nav-group:first-of-type{margin-top:2px;}
.nav-label{font-size:10px;letter-spacing:0.08em;color:var(--sidebar-text-dim);text-transform:uppercase;padding:0 10px;margin-bottom:4px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;font-size:12.5px;color:var(--sidebar-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:#1E232C;color:#fff;}
.nav-item.active{background:var(--sidebar-active);color:#fff;}
.nav-item.disabled{opacity:0.35;cursor:not-allowed;}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:var(--sidebar-text-dim);flex-shrink:0;}
.sidebar-footer{margin-top:auto;padding:10px;border-top:1px solid #262C37;}
.offline-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);font-weight:600;}
.offline-status .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,143,91,0.5);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,143,91,0.45);}70%{box-shadow:0 0 0 6px rgba(47,143,91,0);}100%{box-shadow:0 0 0 0 rgba(47,143,91,0);}}
.offline-sub{font-size:10px;color:var(--sidebar-text-dim);margin-top:2px;}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;padding:0 20px;justify-content:space-between;}
.topbar-title{font-size:13.5px;font-weight:600;}
.topbar-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;}
.badge.blue{background:var(--accent-soft);color:var(--accent);}
.badge.green{background:var(--green-soft);color:var(--green);}
.content{flex:1;overflow-y:auto;padding:22px 26px 60px 26px;}

/* generic */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;}
.section-title{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
.h1{font-size:18px;font-weight:700;margin:0 0 4px 0;}
.sub{font-size:12.5px;color:var(--text-dim);margin:0 0 18px 0;}
.grid{display:grid;gap:14px;}
.stat{padding:14px 16px;}
.stat-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:700;font-family:var(--mono);}
.stat-value.small{font-size:16px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);background:#FAFBFC;position:sticky;top:0;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap;}
.pill.red{background:var(--red-soft);color:var(--red);}
.pill.amber{background:var(--amber-soft);color:var(--amber);}
.pill.green{background:var(--green-soft);color:var(--green);}
.pill.gray{background:#EEF0F2;color:var(--text-dim);}
.pill.blue{background:var(--accent-soft);color:var(--accent);}

.btn{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);padding:7px 13px;border-radius:5px;font-size:12.5px;font-weight:600;}
.btn:hover{background:#F1F2F4;}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text);}
.btn.primary:hover{background:#000;}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.accent:hover{background:#245A99;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn.small{padding:4px 9px;font-size:11.5px;}

select.action-select{font-size:12px;padding:5px 7px;border-radius:4px;border:1px solid var(--border-strong);background:#fff;color:var(--text);font-weight:600;}

.masked{font-family:var(--mono);letter-spacing:1px;color:var(--text-faint);}

/* import screen */
.import-wrap{max-width:640px;margin:40px auto 0 auto;text-align:center;}
.dropzone{border:1.5px dashed var(--border-strong);border-radius:8px;padding:44px 20px;background:var(--panel);}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.mark-big{width:52px;height:52px;margin:0 auto 14px auto;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--text);}

.col-row{display:grid;grid-template-columns:1.4fr 0.9fr 1fr 1.3fr;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);}
.col-row:last-child{border-bottom:none;}
.col-name{font-weight:600;font-size:12.5px;}
.col-type{font-size:10.5px;color:var(--text-dim);font-family:var(--mono);}
.reason{font-size:11px;color:var(--text-dim);margin-top:2px;}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.compare-col{padding:0;}
.compare-head{padding:9px 14px;font-size:10.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;border-bottom:1px solid var(--border);}
.compare-head.orig{color:var(--red);background:var(--red-soft);}
.compare-head.prot{color:var(--green);background:var(--green-soft);}

.callout{border-radius:6px;padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;}
.callout.amber{background:var(--amber-soft);color:#7A5310;}
.callout.green{background:var(--green-soft);color:#1E6B41;}
.callout.blue{background:var(--accent-soft);color:#1B4A7A;}
.callout.red{background:var(--red-soft);color:#7A251C;}
.tech-details{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;cursor:pointer;}
.tech-details pre{white-space:pre-wrap;margin:6px 0 0 0;background:#F6F2F1;padding:8px;border-radius:4px;}
.validation-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0;}
.validation-row .ok{color:var(--green);}
.validation-row .pending{color:var(--text-faint);}

.overlay{position:fixed;inset:0;background:rgba(15,17,22,0.45);display:flex;justify-content:flex-end;z-index:50;}
.inspector{width:400px;max-width:92vw;height:100%;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,0.12);}
.inspector-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:2;}
.inspector-close{border:none;background:none;font-size:16px;color:var(--text-dim);cursor:pointer;padding:2px 6px;}
.inspector-close:hover{color:var(--text);}
.inspector-body{padding:18px 20px;}
.ins-block{margin-bottom:20px;}
.ins-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:700;margin-bottom:8px;}
.ins-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;border-bottom:1px solid #F0F1F3;}
.ins-row:last-child{border-bottom:none;}
.ins-row .k{color:var(--text-dim);}
.ins-row .v{font-weight:600;font-family:var(--mono);text-align:right;}
.freq-bar-wrap{margin-bottom:6px;}
.freq-bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;}
.freq-bar-track{height:6px;background:#EEF0F2;border-radius:3px;overflow:hidden;}
.freq-bar-fill{height:100%;background:var(--accent);}
.sample-chip{display:inline-block;font-family:var(--mono);font-size:11px;background:#F4F5F6;border:1px solid var(--border);padding:2px 7px;border-radius:3px;margin:0 4px 4px 0;}
.col-clickable{cursor:pointer;}
.col-clickable:hover{text-decoration:underline;text-decoration-color:var(--border-strong);}
th.col-clickable:hover{background:#F1F3F5;}

.dt-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.dt-toolbar input[type=text]{font-size:12px;padding:6px 9px;border:1px solid var(--border-strong);border-radius:5px;width:200px;}
th.sortable{cursor:pointer;user-select:none;position:relative;}
th.sortable:hover{background:#F1F3F5;}
.sort-arrow{font-size:9px;margin-left:3px;color:var(--accent);}
th.pinned, td.pinned{position:sticky;left:0;background:#FAFBFC;z-index:1;box-shadow:2px 0 4px rgba(0,0,0,0.04);}
td.pinned{background:var(--panel);}
.resize-handle{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;}
.resize-handle:hover{background:var(--accent-soft);}
.columns-panel{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,0.12);padding:8px;z-index:30;max-height:280px;overflow-y:auto;min-width:180px;}
.columns-panel label{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border-radius:4px;cursor:pointer;}
.columns-panel label:hover{background:#F4F5F6;}
.dt-th-inner{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.pin-btn{font-size:9px;opacity:0.5;background:none;border:none;cursor:pointer;padding:1px 3px;}
.pin-btn:hover{opacity:1;}
.pin-btn.active{opacity:1;color:var(--accent);}

/* focus-visible accessibility */
button:focus-visible, .nav-item:focus-visible, .tab:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible, label.btn:focus-within{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

@media print{
  .sidebar, .topbar, .dt-toolbar, .tabs, .btn, button, select, input{ display:none !important; }
  .content{ overflow:visible !important; padding:0 !important; }
  .app{ display:block !important; height:auto !important; }
  .panel{ break-inside:avoid; border:1px solid #999; }
  body{ background:#fff; }
}
.print-only{display:none;}
.processing-overlay{position:fixed;inset:0;background:rgba(20,23,28,0.35);display:flex;align-items:center;justify-content:center;z-index:60;}
.processing-card{background:var(--panel);border-radius:8px;padding:24px 32px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.18);}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px auto;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.pipeline-steps{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:16px 0;}
.pipeline-step{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;}
.pipeline-step .num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
.pipeline-step .lbl{font-size:10.5px;color:var(--text-dim);text-align:center;}
.pipeline-arrow{color:var(--border-strong);font-size:12px;padding-bottom:16px;}
@media (max-width:600px){ .pipeline-arrow{display:none;} .pipeline-steps{gap:10px;} }

.checklist{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.check-item .ok{color:var(--green);font-weight:700;}

.audit-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-item:last-child{border-bottom:none;}
.audit-time{color:var(--text-faint);font-family:var(--mono);font-size:11px;width:70px;flex-shrink:0;}

.risk-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:5px;font-weight:700;font-size:14px;}

.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D5D8DD;border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:760px){
  .sidebar{position:fixed;left:-220px;top:0;bottom:0;z-index:20;transition:left .2s;}
  .sidebar.open{left:0;}
  .grid.cols-4{grid-template-columns:1fr 1fr !important;}
  .col-row{grid-template-columns:1fr;gap:4px;}
  .compare-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">

  <div class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.4"/>
        <rect x="14" y="2" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.4" opacity="0.35"/>
        <rect x="2" y="14" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.4" opacity="0.35"/>
        <path d="M14 18 L18 18 L18 14" stroke="#4C8FE0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 14 L18 18" stroke="#4C8FE0" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="1.1" fill="#4C8FE0"/>
      </svg>
      <div>
        <div class="brand-name">DataPermit</div>
        <div class="brand-tag">local &amp; offline</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Data</div>
      <button class="nav-item" data-view="overview"><span class="dot"></span>Overview</button>
      <button class="nav-item" data-view="data"><span class="dot"></span>Data Table</button>
      <button class="nav-item" data-view="projects"><span class="dot"></span>Projects</button>
    </div>
    <div class="nav-group">
      <div class="nav-label">Privacy</div>
      <button class="nav-item" data-view="privacy"><span class="dot"></span>Privacy Review</button>
      <button class="nav-item" data-view="aiview"><span class="dot"></span>AI View</button>
    </div>
    <div class="nav-group">
      <div class="nav-label">Analysis</div>
      <button class="nav-item" data-view="quality"><span class="dot"></span>Data Quality</button>
      <button class="nav-item" data-view="report"><span class="dot"></span>Verify &amp; Report</button>
      <button class="nav-item" data-view="export"><span class="dot"></span>Export</button>
    </div>
    <div class="nav-group">
      <div class="nav-label">System</div>
      <button class="nav-item" data-view="audit"><span class="dot"></span>Audit</button>
      <button class="nav-item" data-view="settings"><span class="dot"></span>Settings</button>
    </div>

    <div class="sidebar-footer">
      <div class="offline-status"><span class="pulse"></span>OFFLINE</div>
      <div class="offline-sub">Processing locally &middot; no network calls</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topTitle">No dataset loaded</div>
        <div class="topbar-sub" id="topSub">Import a dataset to begin</div>
      </div>
      <div class="topbar-right">
        <span class="badge blue" id="datasetBadge" style="display:none;"></span>
        <span class="badge green">● OFFLINE</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>

<script>
/* =========================================================
   DATAPERMIT — client-side prototype
   Everything below runs entirely in the browser. No network
   requests are made anywhere in this file.
   ========================================================= */

const state = {
  dataset: null,        // {name, rows:[...], columns:[...], sizeBytes}
  columns: [],           // [{name,type,nulls,unique,sensitivity,confidence,reason,samples}]
  protocols: {},          // colName -> action (resolved, per-dataset)
  explicitlySet: new Set(), // colNames the user has manually chosen this session — protocol runs won't overwrite these
  generalizeBuckets: {},   // colName -> bucket size override for GENERALIZE
  protected: null,        // transformed rows
  protectedColumns: [],   // remaining column names after protection
  tokenMaps: {},           // colName -> Map(original->token) [not exported]
  secondScan: [],          // warnings after protection
  verificationChecks: [],
  audit: [],
  view: 'overview',
  privacySubTab: 'columns', // 'columns' | 'library'
  reviewPage: 0,
  reviewSearch: '',
  revealOriginals: false,
  aiViewPage: 0,
  aiViewSearch: '',
  reportSubTab: 'verify',
  exportSelection: {dataset:true, format:'csv', privacyReport:true, qualityReport:false, protocolConfig:false},
  dataTable: {

/* ---------------- CSV / file parsing ---------------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift().map(h=>h.trim());
  const objRows = rows.filter(r=>r.length>1 || (r.length===1 && r[0]!=='')).map(r=>{
    const o={};
    header.forEach((h,idx)=>o[h]=(r[idx]!==undefined?r[idx]:''));
    return o;
  });
  return {header, rows: objRows};
}

function computeChecksum(data){
  let h1=0, h2=0;
  const isStr = typeof data === 'string';
  const arr = isStr ? null : new Uint8Array(data);
  const len = isStr ? data.length : arr.length;
  for(let i=0;i<len;i++){
    const c = isStr ? data.charCodeAt(i) : arr[i];
    h1 = (h1*33 + c) >>> 0;
    h2 = (h2*17 + c + i) >>> 0;
  }
  return (h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0')).toUpperCase();
}

function parseDelimited(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const header = (rows.shift()||[]).map(h=>h.trim());
  const objRows = rows.filter(r=>r.length>1 || (r.length===1 && r[0]!=='')).map(r=>{
    const o={};
    header.forEach((h,idx)=>o[h]=(r[idx]!==undefined?r[idx]:''));
    return o;
  });
  return {header, rows: objRows};
}

/* ---------------- Sensitivity detection ---------------- */
const PATTERNS = {
  email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
  phone: /^[+]?[\d][\d\-\.\s\(\)]{7,}\d$/,
  ssn: /^\d{3}-\d{2}-\d{4}$/,
  creditcard: /^(\d{4}[- ]?){3}\d{4}$/,
  ip: /^(\d{1,3}\.){3}\d{1,3}$/,
  apikey: /^[A-Za-z0-9_\-]{20,}$/,
  date: /^\d{4}-\d{2}-\d{2}$/
};
const NAME_HINTS = {
  email:['email','e-mail','mail'],
  phone:['phone','mobile','contact_number','cell'],
  ssn:['ssn','social_security','national_id','tax_id'],
  name:['name','full_name','first_name','last_name','employee_name'],
  address:['address','street','location','residence'],
  dob:['dob','birth','date_of_birth','birthdate'],
  id:['employee_id','emp_id','id','identifier','user_id'],
  salary:['salary','wage','compensation','income'],
  secret:['password','api_key','apikey','token','secret','access_key'],
  ip:['ip','ip_address'],
  card:['card','credit_card','cc_number','account_number','iban']
};

function nameMatches(colName, list){
  const n = colName.toLowerCase().replace(/[^a-z]/g,'_');
  return list.some(k=>n.includes(k.replace(/[^a-z]/g,'_')));
}

const NAME_SHAPE = /^[A-Z][a-zA-Z'-]+(\s[A-Z][a-zA-Z'-]+){1,2}$/;
function looksLikeFullName(samples){
  const nonEmpty = samples.filter(s=>s!=='' && s!=null).slice(0,15);
  if(nonEmpty.length<3) return false;
  const matches = nonEmpty.filter(v=>NAME_SHAPE.test(String(v).trim()));
  return matches.length >= Math.max(2, Math.ceil(nonEmpty.length*0.7));
}

function detectColumnSensitivity(colName, samples){
  const nonEmpty = samples.filter(s=>s!=='' && s!=null);
  const test = (re)=> nonEmpty.length>0 && nonEmpty.slice(0,15).filter(v=>re.test(String(v).trim())).length >= Math.max(1,Math.ceil(nonEmpty.slice(0,15).length*0.6));

  const checks = [
    {key:'email', label:'Email', pat: test(PATTERNS.email), name: nameMatches(colName,NAME_HINTS.email), risk:'HIGH'},
    {key:'phone', label:'Phone Number', pat: test(PATTERNS.phone), name: nameMatches(colName,NAME_HINTS.phone), risk:'HIGH'},
    {key:'ssn', label:'Government Identifier', pat: test(PATTERNS.ssn), name: nameMatches(colName,NAME_HINTS.ssn), risk:'HIGH'},
    {key:'creditcard', label:'Financial Card Number', pat: test(PATTERNS.creditcard), name: nameMatches(colName,NAME_HINTS.card), risk:'HIGH'},
    {key:'ip', label:'IP Address', pat: test(PATTERNS.ip), name: nameMatches(colName,NAME_HINTS.ip), risk:'MEDIUM'},
    {key:'secret', label:'Credential / Secret', pat: test(PATTERNS.apikey) , name: nameMatches(colName,NAME_HINTS.secret), risk:'HIGH'},
    {key:'dob', label:'Date of Birth', pat: test(PATTERNS.date) && nameMatches(colName,NAME_HINTS.dob), name: nameMatches(colName,NAME_HINTS.dob), risk:'HIGH'},
    {key:'name', label:'Personal Name', pat: looksLikeFullName(samples), name: nameMatches(colName,NAME_HINTS.name), risk:'HIGH', weak:true},
    {key:'address', label:'Physical Address', pat:false, name: nameMatches(colName,NAME_HINTS.address), risk:'MEDIUM'},
    {key:'id', label:'Internal Identifier', pat:false, name: nameMatches(colName,NAME_HINTS.id) && !nameMatches(colName,['email']), risk:'MEDIUM'},
    {key:'salary', label:'Business-Sensitive (Compensation)', pat:false, name: nameMatches(colName,NAME_HINTS.salary), risk:'LOW'}
  ];

  for(const c of checks){
    if(c.pat && c.name) return {sensitivity:c.risk, label:c.label, confidence:'High', reason:`Column name and value pattern both match ${c.label.toLowerCase()} structure.`, method:'Pattern match + column-name analysis'};
  }
  for(const c of checks){
    if(c.pat && !c.weak) return {sensitivity:c.risk, label:c.label, confidence:'High', reason:`Values match the standard ${c.label.toLowerCase()} pattern.`, method:'Pattern match'};
  }
  for(const c of checks){
    if(c.name) return {sensitivity:c.risk, label:c.label, confidence:'Medium', reason:`Column name suggests ${c.label.toLowerCase()}.`, method:'Column-name heuristic'};
  }
  for(const c of checks){
    if(c.pat && c.weak) return {sensitivity:c.risk, label:c.label, confidence:'Medium', reason:`Values resemble full names (capitalized word pairs). This is a heuristic, not true name recognition, and can misfire on other title-case text — please confirm manually.`, method:'Pattern heuristic (weak)'};
  }
  return {sensitivity:'NONE', label:'Not sensitive', confidence:'—', reason:'No pattern or column-name signal matched.', method:'—'};
}

function inferType(samples){
  const nonEmpty = samples.filter(s=>s!=='' && s!=null);
  if(nonEmpty.length===0) return 'string';
  const numeric = nonEmpty.every(v=>!isNaN(parseFloat(v)) && isFinite(v));
  if(numeric) return 'number';
  const dateish = nonEmpty.every(v=>PATTERNS.date.test(String(v).trim()));
  if(dateish) return 'date';
  return 'string';
}

function analyzeColumns(header, rows){
  return header.map(name=>{
    const samples = rows.map(r=>r[name]);
    const type = inferType(samples);
    const nonEmpty = samples.filter(s=>s!=='' && s!=null);
    const nulls = samples.length - nonEmpty.length;
    const uniqueSet = new Set(nonEmpty.map(String));
    const det = detectColumnSensitivity(name, samples);

    let stats = null;
    let outlierCount = 0;
    let topValues = null;
    if(type==='number'){
      const nums = nonEmpty.map(v=>parseFloat(v)).sort((a,b)=>a-b);
      const q = (p)=>{
        const idx=(nums.length-1)*p; const lo=Math.floor(idx), hi=Math.ceil(idx);
        return nums[lo] + (nums[hi]-nums[lo])*(idx-lo);
      };
      const q1=q(0.25), q3=q(0.75), iqr=q3-q1;
      const lowFence=q1-1.5*iqr, highFence=q3+1.5*iqr;
      outlierCount = nums.filter(n=>n<lowFence||n>highFence).length;
      const mean = nums.reduce((a,b)=>a+b,0)/nums.length;
      const variance = nums.reduce((a,b)=>a+Math.pow(b-mean,2),0)/nums.length;
      stats = {mean, median:q(0.5), min:nums[0], max:nums[nums.length-1], std:Math.sqrt(variance), q1, q3, iqr};
    } else {
      const freq = new Map();
      nonEmpty.forEach(v=>{ const k=String(v); freq.set(k,(freq.get(k)||0)+1); });
      topValues = Array.from(freq.entries()).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([value,count])=>({value, count, pct: nonEmpty.length? (count/nonEmpty.length*100):0}));
    }

    return {
      name, type,
      nulls, nullPct: samples.length? (nulls/samples.length*100):0,
      unique: uniqueSet.size,
      cardinality: nonEmpty.length? (uniqueSet.size/nonEmpty.length):0,
      sensitivity: det.sensitivity, sensLabel: det.label, confidence: det.confidence, reason: det.reason, method: det.method,
      samples: samples.slice(0,5),
      stats, outlierCount, topValues
    };
  });
}

function suggestAction(col){
  if(col.sensitivity==='HIGH'){
    if(col.type==='number') return 'GENERALIZE';
    if(col.unique === (col.nulls>=0? (state.dataset? state.dataset.rows.length-col.nulls:col.unique):col.unique) && col.name.toLowerCase().includes('id')) return 'TOKENIZE';
    return 'MASK';
  }
  if(col.sensitivity==='MEDIUM') return 'REVIEW';
  return 'ALLOW';
}

/* ---------------- Rule matching ---------------- */
function ruleMatchesColumn(rule, col){
  switch(rule.matchType){
    case 'column_name_exact':
      return col.name.toLowerCase() === rule.matchValue.toLowerCase();
    case 'column_name_contains':
      return col.name.toLowerCase().includes(rule.matchValue.toLowerCase());
    case 'column_type':
      return col.type === rule.matchValue;
    case 'sensitivity_label':
      return col.sensLabel === rule.matchValue;
    case 'sensitivity_level':
      return col.sensitivity === rule.matchValue;
    default:
      return false;
  }
}

// Precedence: mandatory protocol -> columns the user set explicitly this session
// -> active protocols in library order -> existing suggested default -> REVIEW.
function applyProtocolLibraryToColumns(logChanges){
  const mandatory = protocolLibrary.find(p=>p.id===MANDATORY_PROTOCOL_ID);
  const others = protocolLibrary.filter(p=>p.id!==MANDATORY_PROTOCOL_ID && p.status==='ACTIVE');

  state.columns.forEach(col=>{
    // Mandatory rules always win, even over explicit user choices.
    for(const rule of mandatory.rules){
      if(ruleMatchesColumn(rule, col)){
        if(state.protocols[col.name] !== rule.action && logChanges) log(`Mandatory rule: ${col.name} → ${rule.action}`);
        state.protocols[col.name] = rule.action;
        return;
      }
    }
    // Respect explicit user choices for this column.
    if(state.explicitlySet.has(col.name)) return;

    // Active protocols, in library order, first matching rule wins.
    for(const protocol of others){
      for(const rule of protocol.rules){
        if(ruleMatchesColumn(rule, col)){
          if(state.protocols[col.name] !== rule.action && logChanges) log(`Protocol "${protocol.name}": ${col.name} → ${rule.action}`);
          state.protocols[col.name] = rule.action;
          return;
        }
      }
    }
    // No protocol matched — leave existing suggested default in place.
  });
}

/* ---------------- Transformations ---------------- */
function simpleHash(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(16).toUpperCase().padStart(6,'0').slice(0,6);
}

function applyProtection(){
  const rows = state.dataset.rows;
  const cols = state.dataset.columns;
  state.tokenMaps = {};
  const keptCols = cols.filter(c=> state.protocols[c] !== 'REMOVE');
  state.protectedColumns = keptCols;

  const tokenCounters = {};
  keptCols.forEach(c=> tokenCounters[c]=0);

  const newRows = rows.map(r=>{
    const nr = {};
    keptCols.forEach(c=>{
      const action = state.protocols[c];
      const val = r[c];
      const colMeta = state.columns.find(x=>x.name===c);
      switch(action){
        case 'ALLOW':
        case 'REVIEW':
          nr[c]=val; break;
        case 'MASK':
          nr[c] = val ? '█'.repeat(Math.min(String(val).length,10)) : val;
          break;
        case 'TOKENIZE': {
          if(!state.tokenMaps[c]) state.tokenMaps[c]=new Map();
          const map = state.tokenMaps[c];
          if(val===''||val==null){ nr[c]=val; break; }
          if(!map.has(val)){ tokenCounters[c]++; map.set(val, `${labelPrefix(c)}_${String(tokenCounters[c]).padStart(3,'0')}`); }
          nr[c]=map.get(val);
          break;
        }
        case 'PSEUDONYMIZE': {
          if(val===''||val==null){ nr[c]=val; break; }
          nr[c] = `${labelPrefix(c)}-${simpleHash(String(val))}`;
          break;
        }
        case 'GENERALIZE': {
          if(val===''||val==null){ nr[c]=val; break; }
          const n = parseFloat(val);
          if(isNaN(n)){ nr[c]=val; break; }
          const override = state.generalizeBuckets[c];
          const bucket = override && override>0 ? override : (colMeta && colMeta.name.toLowerCase().includes('age') ? 5 : Math.max(10, Math.round((colMeta && colMeta.stats ? colMeta.stats.iqr : 10)/4) || 10));
          const lo = Math.floor(n/bucket)*bucket;
          nr[c] = `${lo}-${lo+bucket}`;
          break;
        }
        default:
          nr[c]=val;
      }
    });
    return nr;
  });

  state.protected = newRows;
  log('Protocols applied to dataset');
  Object.keys(state.protocols).forEach(c=>{
    if(state.protocols[c]==='REMOVE') log(`${c} removed`);
    else if(state.protocols[c]==='MASK') log(`${c} masked`);
    else if(state.protocols[c]==='TOKENIZE') log(`${c} tokenized`);
    else if(state.protocols[c]==='PSEUDONYMIZE') log(`${c} pseudonymized`);
    else if(state.protocols[c]==='GENERALIZE') log(`${c} generalized`);
  });
  runSecondScan();
}

function labelPrefix(colName){
  const n = colName.toLowerCase();
  if(n.includes('email')) return 'EMAIL';
  if(n.includes('name')) return 'PERSON';
  if(n.includes('phone')) return 'PHONE';
  if(n.includes('id')) return 'ID';
  if(n.includes('address')) return 'ADDR';
  return 'VAL';
}

function runSecondScan(){
  const warnings = [];
  state.protectedColumns.forEach(c=>{
    const samples = state.protected.map(r=>r[c]);
    const det = detectColumnSensitivity(c, samples);
    if(det.sensitivity!=='NONE'){
      const action = state.protocols[c];
      const wasSupposedToTransform = ['MASK','TOKENIZE','PSEUDONYMIZE','GENERALIZE'].includes(action);
      if(wasSupposedToTransform || action==='ALLOW' || action==='REVIEW'){
        warnings.push({
          column:c,
          detection:det.label,
          severity: wasSupposedToTransform ? 'HIGH' : det.sensitivity,
          note: wasSupposedToTransform
            ? `Transformation (${action.charAt(0)+action.slice(1).toLowerCase()}) did not fully clear the detected pattern — review this column.`
            : (action==='REVIEW' ? 'Marked for review — not yet resolved' : 'Allowed without transformation'),
          unexpected: wasSupposedToTransform
        });
      }
    }
  });
  state.secondScan = warnings;
  log(warnings.length ? `Second privacy scan: ${warnings.length} field(s) still flagged` : 'Second privacy scan: no remaining sensitive fields detected');
  runVerificationChecks();
  log('Protected dataset verified');
}

function runVerificationChecks(){
  const checks = [];

  checks.push({
    label: 'Row count preserved',
    pass: state.protected.length === state.dataset.rows.length,
    detail: `${state.protected.length} of ${state.dataset.rows.length} original rows present.`
  });

  const expectedRemoved = state.dataset.columns.filter(c=>state.protocols[c]==='REMOVE');
  const actuallyRemoved = state.dataset.columns.filter(c=>!state.protectedColumns.includes(c));
  checks.push({
    label: 'Column removal matches protocol',
    pass: expectedRemoved.length === actuallyRemoved.length && expectedRemoved.every(c=>actuallyRemoved.includes(c)),
    detail: actuallyRemoved.length ? `Removed: ${actuallyRemoved.join(', ')}` : 'No columns were removed.'
  });

  let tokenCollision = false;
  const tokenDetails = [];
  Object.keys(state.tokenMaps).forEach(c=>{
    const map = state.tokenMaps[c];
    const uniqueOriginals = map.size;
    const uniqueTokens = new Set(map.values()).size;
    if(uniqueTokens !== uniqueOriginals) tokenCollision = true;
    tokenDetails.push(`${c}: ${uniqueOriginals} value(s) → ${uniqueTokens} token(s)`);
  });
  checks.push({
    label: 'Tokenization is collision-free',
    pass: !tokenCollision,
    detail: tokenDetails.length ? tokenDetails.join(' · ') : 'No tokenized columns in this run.'
  });

  const unexpectedFailures = state.secondScan.filter(w=>w.unexpected);
  checks.push({
    label: 'No transformation failures detected',
    pass: unexpectedFailures.length === 0,
    detail: unexpectedFailures.length ? `${unexpectedFailures.length} transformed column(s) still match a sensitive pattern.` : 'All transformed columns cleared the second scan.'
  });

  checks.push({
    label: 'Original file unchanged',
    pass: true,
    detail: `Local integrity checksum ${state.dataset.checksum} recorded at import and never rewritten. DataPermit only reads the original file.`
  });

  state.verificationChecks = checks;
}

/* ---------------- Sample dataset ---------------- */
function sampleDataset(){
  const first=['Rahul','Emma','Wei','Fatima','Lucas','Aisha','Noah','Priya','Diego','Mei','Omar','Sofia','Liam','Ines','Kenji'];
  const last=['Sharma','Johnson','Chen','Khan','Garcia','Patel','Smith','Nair','Rossi','Wang','Haddad','Silva','Brown','Dubois','Sato'];
  const dept=['Engineering','Sales','Finance','HR','Marketing','Operations'];
  const rows=[];
  for(let i=0;i<28;i++){
    const f=first[i%first.length], l=last[(i*3+1)%last.length];
    const id = 39000+i*7;
    const salary = 52000 + Math.round(Math.random()*70000);
    rows.push({
      Employee_ID: `EMP-${id}`,
      Name: `${f} ${l}`,
      Email: `${f.toLowerCase()}.${l.toLowerCase()}@company.com`,
      Phone: `+1-${200+i}-555-${1000+i*3}`,
      Department: dept[i%dept.length],
      Salary: (i===4? 410000 : i===19? 9000 : salary), // outliers
      Date_of_Birth: `19${70+ (i%25)}-0${1+(i%9)}-1${i%9}`,
      Address: `${100+i} Maple Street, Springfield`
    });
  }
  // inject some quality issues
  rows[3].Email = 'not-an-email';
  rows[7].Salary = '';
  rows[12].Salary = '';
  rows[15].Phone = '';
  rows[9] = {...rows[2], Employee_ID:'EMP-39999'}; // duplicate-ish row
  return rows;
}

function loadSheet(f, wb, sheetName, rawResult){
  const sheet = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
  if(!json || json.length===0){
    showImportError('DataPermit couldn\'t find data in this sheet.', `The sheet "${sheetName}" appears to be empty.`, 'Choose a different sheet, or confirm it has a header row.');
    return;
  }
  const header = Array.from(json.reduce((set,row)=>{ Object.keys(row).forEach(k=>set.add(k)); return set; }, new Set()));
  const rows = json.map(row=>{ const o={}; header.forEach(h=> o[h] = row[h]!==undefined ? String(row[h]) : ''); return o; });
  log(`Format validated: XLSX structure confirmed (sheet "${sheetName}")`);
  finishImport(f.name, header, rows, f.size, computeChecksum(rawResult));
}

function handleImportedFile(f){
  clearImportError();
  const nameLower = f.name.toLowerCase();
  const ext = nameLower.includes('.') ? nameLower.split('.').pop() : '';
  const supported = ['csv','xlsx','xls','json','txt','xml'];
  const plannedNotYet = ['parquet','sql','db'];

  // 1. Extension validation
  if(plannedNotYet.includes(ext)){
    showImportError(
      "This format isn't available in this preview yet.",
      `Support for ".${ext}" is planned but not built into this browser-based preview.`,
      'Try a .csv, .xlsx, .json, .txt, or .xml export instead.',
      `filename=${f.name}`
    );
    return;
  }
  if(!supported.includes(ext)){
    showImportError(
      "DataPermit doesn't support this file type.",
      `Files ending in ".${ext || '?'}" aren't supported.`,
      'Try a .csv, .xlsx, .json, .txt, or .xml file instead.',
      `filename=${f.name}`
    );
    return;
  }

  // 2. File size check
  const sizeMB = f.size / (1024*1024);
  if(sizeMB > MAX_FILE_MB){
    showImportError(
      "This file is larger than DataPermit can currently handle.",
      `The file is ${sizeMB.toFixed(1)} MB. The current limit for this preview is ${MAX_FILE_MB} MB.`,
      'Try a smaller export, or split the file and import in parts.',
      `size=${f.size} bytes`
    );
    return;
  }
  if(f.size === 0){
    showImportError(
      "This file appears to be empty.",
      'DataPermit couldn\'t find any content to read.',
      'Check the file and try again.'
    );
    return;
  }

  log(`File validated: ${f.name} (${sizeMB.toFixed(2)} MB)`);

  // 3. Read + actual-format validation (extension vs real content)
  const reader = new FileReader();
  reader.onerror = ()=>{
    showImportError("DataPermit couldn't read this file.", 'The file may be corrupted or in use by another program.', 'Try another file.', String(reader.error));
  };

  if(ext==='csv'){
    reader.onload = ()=>{
      try{
        const {header, rows} = parseCSV(reader.result);
        if(!header || header.length===0 || rows.length===0){
          showImportError('DataPermit couldn\'t find tabular data in this file.', 'The file was readable but no rows or columns were detected.', 'Confirm the file has a header row and at least one data row.');
          return;
        }
        log('Format validated: CSV structure confirmed');
        finishImport(f.name, header, rows, f.size, computeChecksum(reader.result));
      }catch(err){
        showImportError('DataPermit couldn\'t parse this file as CSV.', 'The file content doesn\'t match standard CSV structure.', 'Check for unescaped commas or quotes, or re-export the file.', String(err));
      }
    };
    reader.readAsText(f);
  } else if(ext==='json'){
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.data) ? parsed.data : null);
        if(!arr || arr.length===0 || typeof arr[0] !== 'object'){
          showImportError('DataPermit couldn\'t find tabular data in this JSON file.', 'Expected a JSON array of objects (records).', 'Export as an array of row objects, e.g. [{"col": "value"}, ...].');
          return;
        }
        const header = Array.from(arr.reduce((set,row)=>{ Object.keys(row).forEach(k=>set.add(k)); return set; }, new Set()));
        const rows = arr.map(row=>{ const o={}; header.forEach(h=> o[h] = row[h]!==undefined ? row[h] : ''); return o; });
        log('Format validated: JSON structure confirmed');
        finishImport(f.name, header, rows, f.size, computeChecksum(reader.result));
      }catch(err){
        showImportError('DataPermit couldn\'t parse this file as JSON.', 'The file content isn\'t valid JSON.', 'Check for a trailing comma or unclosed bracket, or re-export the file.', String(err));
      }
    };
    reader.readAsText(f);
  } else if(ext==='txt'){
    reader.onload = ()=>{
      try{
        const text = reader.result;
        const firstLine = text.split(/\r?\n/)[0] || '';
        const candidates = [['\t','tab'],[',','comma'],['|','pipe'],[';','semicolon']];
        let best = candidates[0];
        candidates.forEach(c=>{ if((firstLine.split(c[0]).length) > (firstLine.split(best[0]).length)) best = c; });
        const delimited = parseDelimited(text, best[0]);
        if(!delimited.header.length || delimited.rows.length===0){
          showImportError('DataPermit couldn\'t find tabular data in this text file.', `Detected "${best[1]}" as the likely delimiter, but no usable rows were found.`, 'Confirm the file has a consistent delimiter and a header row.');
          return;
        }
        log(`Format validated: TXT structure confirmed (${best[1]}-delimited)`);
        finishImport(f.name, delimited.header, delimited.rows, f.size, computeChecksum(text));
      }catch(err){
        showImportError('DataPermit couldn\'t parse this text file.', 'Could not detect a consistent delimiter and header row.', 'Try exporting as CSV instead.', String(err));
      }
    };
    reader.readAsText(f);
  } else if(ext==='xml'){
    reader.onload = ()=>{
      try{
        const text = reader.result;
        const xmlDoc = new DOMParser().parseFromString(text, 'application/xml');
        if(xmlDoc.querySelector('parsererror')){
          showImportError('DataPermit couldn\'t parse this file as XML.', 'The file isn\'t well-formed XML.', 'Check for unclosed tags, or re-export the file.');
          return;
        }
        const root = xmlDoc.documentElement;
        const recordEls = Array.from(root.children);
        if(recordEls.length===0){
          showImportError('DataPermit couldn\'t find repeating records in this XML file.', 'Expected a root element containing repeated record elements, e.g. <rows><row><col>value</col></row></rows>.', 'Check the file structure.');
          return;
        }
        const headerSet = new Set();
        const rows = recordEls.map(rec=>{
          const o = {};
          Array.from(rec.children).forEach(field=>{ o[field.tagName] = field.textContent; headerSet.add(field.tagName); });
          if(Array.from(rec.children).length===0){ o[rec.tagName]=rec.textContent; headerSet.add(rec.tagName); }
          return o;
        });
        const header = Array.from(headerSet);
        const normalizedRows = rows.map(row=>{ const o={}; header.forEach(h=> o[h]=row[h]!==undefined?row[h]:''); return o; });
        log('Format validated: XML structure confirmed');
        finishImport(f.name, header, normalizedRows, f.size, computeChecksum(text));
      }catch(err){
        showImportError('DataPermit couldn\'t parse this file as XML.', 'An unexpected error occurred while reading the file.', 'Check the file structure, or try CSV/JSON instead.', String(err));
      }
    };
    reader.readAsText(f);
  } else if(ext==='xlsx' || ext==='xls'){
    reader.onload = ()=>{
      try{
        if(typeof XLSX === 'undefined'){
          if(appSettings.offlineLock){
            showImportError('XLSX reading is unavailable with Strict Offline Lock enabled.', 'The XLSX parser loads once from a CDN on first use, and Strict Offline Lock (Settings → Offline Mode) blocks that.', 'Disable Strict Offline Lock once, or use a CSV/JSON export instead.');
            return;
          }
          showImportError('The XLSX reader didn\'t load.', 'This preview loads a local spreadsheet-parsing library from a CDN the first time it\'s used.', 'Check your connection for this one-time load, or use a CSV export instead.');
          return;
        }
        const wb = XLSX.read(reader.result, {type:'array'});
        if(wb.SheetNames.length > 1){
          showSheetPicker(f, wb, reader.result);
          return;
        }
        loadSheet(f, wb, wb.SheetNames[0], reader.result);
      }catch(err){
        showImportError('DataPermit couldn\'t parse this file as XLSX.', 'The file may be corrupted, password-protected, or not a real spreadsheet despite its extension.', 'Try re-saving the file from your spreadsheet app, or export as CSV.', String(err));
      }
    };
    reader.readAsArrayBuffer(f);
  }
}

function countDuplicateRows(rows){
  const seen = new Map();
  let dup=0;
  rows.forEach(r=>{
    const key = JSON.stringify(r);
    seen.set(key,(seen.get(key)||0)+1);
  });
  seen.forEach(v=>{ if(v>1) dup += v; });
  return dup;
}

function duplicateRowIndexSet(rows){
  const keyToIndices = new Map();
  rows.forEach((r,i)=>{
    const key = JSON.stringify(r);
    if(!keyToIndices.has(key)) keyToIndices.set(key, []);
    keyToIndices.get(key).push(i);
  });
  const dupIndices = new Set();
  keyToIndices.forEach(idxList=>{ if(idxList.length>1) idxList.forEach(i=>dupIndices.add(i)); });
  return dupIndices;
}

function firstOccurrenceIndices(rows){
  const seen = new Set();
  const keep = [];
  rows.forEach((r,i)=>{
    const key = JSON.stringify(r);
    if(!seen.has(key)){ seen.add(key); keep.push(i); }
  });
  return keep;
}

function getExportRowIndices(){
  if(state.qualityDecisions.__duplicates__ === 'remove'){
    return firstOccurrenceIndices(state.dataset.rows);
  }
  return state.protected.map((_,i)=>i);
}

function visibleDataColumns(){
  const d = state.dataset;
  return d.columns.filter(c=>!state.dataTable.hiddenCols.has(c));
}

function getFilteredSortedRows(){
  const d = state.dataset;
  const dt = state.dataTable;
  let indices = d.rows.map((_,i)=>i);

  if(dt.rowFilter){
    const {column, type} = dt.rowFilter;
    if(type==='duplicate'){
      const dupSet = duplicateRowIndexSet(d.rows);
      indices = indices.filter(i=>dupSet.has(i));
    } else {
    indices = indices.filter(i=>{
      const v = d.rows[i][column];
      if(type==='missing') return v===''||v==null;
      if(type==='outlier'){
        const meta = state.columns.find(x=>x.name===column);
        if(!meta || !meta.stats) return false;
        const n = parseFloat(v);
        if(isNaN(n)) return false;
        const lowFence = meta.stats.q1 - 1.5*meta.stats.iqr, highFence = meta.stats.q3 + 1.5*meta.stats.iqr;
        return n<lowFence || n>highFence;
      }
      return true;
    });
    }
  }

  const q = dt.search.trim().toLowerCase();
  if(q){
    indices = indices.filter(i=>{
      const hay = d.columns.map(c=>String(d.rows[i][c]||'')).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  if(dt.sortCol){
    const meta = state.columns.find(x=>x.name===dt.sortCol);
    indices.sort((a,b)=>{
      let va = d.rows[a][dt.sortCol], vb = d.rows[b][dt.sortCol];
      if(meta && meta.type==='number'){ va=parseFloat(va); vb=parseFloat(vb); if(isNaN(va)) va=-Infinity; if(isNaN(vb)) vb=-Infinity; }
      else { va=String(va||''); vb=String(vb||''); }
      if(va<vb) return -1*dt.sortDir;
      if(va>vb) return 1*dt.sortDir;
      return 0;
    });
  }
  return indices;
}

          return `<th class="col-clickable sortable ${pinned?'pinned':''}" style="width:${width}px;" title="Click to sort. Click the column name text to inspect.">
            <div class="dt-th-inner">
              <span onclick="openColumnInspector('${c.replace(/'/g,"\\'")}')" style="flex:1;" tabindex="0" role="button" aria-label="Inspect column ${esc(c)}">

                <br><span style="font-weight:400;text-transform:none;font-size:10px;">${meta.nullPct.toFixed(0)}% missing</span>
              </span>
              <button class="pin-btn ${pinned?'active':''}" title="${pinned?'Unpin column':'Pin column'}" aria-label="${pinned?'Unpin':'Pin'} ${esc(c)}" onclick="event.stopPropagation(); toggleColumnPin('${c.replace(/'/g,"\\'")}')">📌</button>
              <span onclick="event.stopPropagation(); setSortColumn('${c.replace(/'/g,"\\'")}')" style="cursor:pointer;padding:2px;" aria-label="Sort by ${esc(c)}">${sortIcon||'⇅'}</span>
            </div>
            <div class="resize-handle" onmousedown="startColumnResize(event,'${c.replace(/'/g,"\\'")}')" aria-hidden="true"></div>
          </th>`;
        }).join('')}</tr></thead>
        <tbody>
          ${pageIndices.length ? pageIndices.map(i=>{
            const r = d.rows[i];
            return `<tr>${cols.map(c=>{
              const meta = state.columns.find(x=>x.name===c);
              const v = r[c];
              const display = (meta.sensitivity==='HIGH' && v) ? maskPreview(v) : esc(v);
              const pinned = dt.pinnedCols.has(c);
              return `<td class="${meta.sensitivity==='HIGH'?'masked':'mono'} ${pinned?'pinned':''}">${display}</td>`;
            }).join('')}</tr>`;
          }).join('') : `<tr><td colspan="${cols.length}" class="empty">No matching rows</td></tr>`}
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">

      <div style="display:flex;gap:6px;">
        <button class="btn small" ${dt.page===0?'disabled':''} onclick="changeDTPage(-1)">← Prev</button>
        <span class="sub" style="margin:0;align-self:center;">Page ${dt.page+1} of ${totalPages}</span>
        <button class="btn small" ${dt.page>=totalPages-1?'disabled':''} onclick="changeDTPage(1)">Next →</button>
      </div>

  `;
}

function setDTSearch(v){ state.dataTable.search=v; state.dataTable.page=0; renderDataTable(); refocusAfterRerender('.dt-toolbar input[type="text"]'); }
function changeDTPage(d){ state.dataTable.page += d; renderDataTable(); }
function setSortColumn(c){
  const dt = state.dataTable;
  if(dt.sortCol===c) dt.sortDir *= -1; else { dt.sortCol=c; dt.sortDir=1; }
  renderDataTable();
}
function toggleColumnPin(c){
  const dt = state.dataTable;
  if(dt.pinnedCols.has(c)) dt.pinnedCols.delete(c); else dt.pinnedCols.add(c);
  renderDataTable();
}
function clearDataTableRowFilter(){ state.dataTable.rowFilter = null; state.dataTable.page = 0; renderDataTable(); }

function toggleColumnsPanel(e){
  e.stopPropagation();
  const anchor = document.getElementById('columnsPanelAnchor');
  if(anchor.children.length){ anchor.innerHTML=''; return; }
  const d = state.dataset;
  const dt = state.dataTable;
  const panel = document.createElement('div');
  panel.className = 'columns-panel';
  panel.innerHTML = d.columns.map(c=>`
    <label><input type="checkbox" ${dt.hiddenCols.has(c)?'':'checked'} onchange="toggleColumnVisible('${c.replace(/'/g,"\\'")}')"> ${esc(c)}</label>

function toggleColumnVisible(c){

let resizeState = null;
function startColumnResize(e, col){
  e.preventDefault(); e.stopPropagation();
  const th = e.target.closest('th');
  resizeState = {col, startX: e.clientX, startWidth: th.offsetWidth};
  document.addEventListener('mousemove', onColumnResize);
  document.addEventListener('mouseup', endColumnResize);
}
function onColumnResize(e){
  if(!resizeState) return;
  const newWidth = Math.max(60, resizeState.startWidth + (e.clientX - resizeState.startX));
  state.dataTable.colWidths[resizeState.col] = newWidth;
  const ths = document.querySelectorAll('th');
  ths.forEach(th=>{ if(th.textContent.trim().startsWith(resizeState.col)) th.style.width = newWidth+'px'; });
}
function endColumnResize(){
  resizeState = null;
  document.removeEventListener('mousemove', onColumnResize);
  document.removeEventListener('mouseup', endColumnResize);
  renderDataTable();
}

function maskPreview(v){
  const s = String(v);
  if(s.length<=2) return '██';
  return s[0]+'█'.repeat(Math.min(s.length-1,8));
}

const MATCH_TYPE_LABELS = {

function renderProtocolLibraryHTML(){

function renderProtocolCard(p, idx){
  return `

          ${!p.builtin? `<button class="btn small" onclick="toggleProtocolStatus('${p.id}')">${p.status==='ACTIVE'?'Disable':'Enable'}</button>`:''}
          <button class="btn small" onclick="openProtocolEditor('${p.id}')">${p.builtin?'View':'Edit'}</button>
          ${!p.builtin? `<button class="btn small" onclick="duplicateProtocol('${p.id}')">Duplicate</button>`:''}
          ${!p.builtin && idx>1 ? `<button class="btn small" onclick="reorderProtocol('${p.id}',-1)">↑</button>`:''}
          ${!p.builtin && idx<protocolLibrary.length-1 ? `<button class="btn small" onclick="reorderProtocol('${p.id}',1)">↓</button>`:''}
          ${!p.builtin? `<button class="btn small" onclick="deleteProtocol('${p.id}')">Delete</button>`:''}
        </div>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">

          <div style="font-size:12px;font-family:var(--mono);color:var(--text-dim);">
            WHEN <span style="color:var(--text);">${esc(MATCH_TYPE_LABELS[r.matchType])}</span> "<span style="color:var(--text);">${esc(r.matchValue)}</span>" DO <span class="pill ${r.action==='REMOVE'?'red':r.action==='ALLOW'?'green':'amber'}">${r.action}</span>
          </div>
        `).join('') || '<div class="faint" style="font-size:12px;">No rules yet.</div>'}
      </div>
    </div>
  `;
}

function toggleProtocolStatus(id){
  const p = protocolLibrary.find(x=>x.id===id);
  if(!p || p.builtin) return;
  p.status = p.status==='ACTIVE' ? 'DISABLED' : 'ACTIVE';
  p.lastModified = 'Just now';
  log(`Protocol "${p.name}" ${p.status==='ACTIVE'?'enabled':'disabled'}`);
  renderPrivacySubTab();
}
function duplicateProtocol(id){
  const p = protocolLibrary.find(x=>x.id===id);
  if(!p) return;
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = 'p'+(ruleIdCounter++);
  copy.name = p.name + ' (copy)';
  copy.status = 'DISABLED';
  copy.lastModified = 'Just now';
  copy.builtin = false;
  const idx = protocolLibrary.findIndex(x=>x.id===id);
  protocolLibrary.splice(idx+1,0,copy);
  log(`Protocol duplicated: ${copy.name}`);
  renderPrivacySubTab();
}
function reorderProtocol(id, dir){
  const idx = protocolLibrary.findIndex(x=>x.id===id);
  const target = idx+dir;
  if(target<1 || target>=protocolLibrary.length) return; // never move above mandatory (index 0)
  const [item] = protocolLibrary.splice(idx,1);
  protocolLibrary.splice(target,0,item);
  renderPrivacySubTab();
}
function deleteProtocol(id){
  const p = protocolLibrary.find(x=>x.id===id);
  if(!p || p.builtin) return;
  if(!confirm(`Delete protocol "${p.name}"? This can't be undone.`)) return;
  protocolLibrary = protocolLibrary.filter(x=>x.id!==id);
  log(`Protocol deleted: ${p.name}`);
  renderPrivacySubTab();
}

let editingProtocolId = null;
let editingDraft = null;

function openProtocolEditor(id){
  editingProtocolId = id;
  if(id){
    const p = protocolLibrary.find(x=>x.id===id);
    editingDraft = JSON.parse(JSON.stringify(p));
  } else {
    editingDraft = {id:'p'+(ruleIdCounter++), name:'', status:'DISABLED', builtin:false, scope:'This dataset', lastModified:'Just now', rules:[]};
  }
  renderProtocolEditorOverlay();
}
function closeProtocolEditor(){
  const el = document.getElementById('protocolEditorOverlay');
  if(el) el.remove();
  document.removeEventListener('keydown', escCloseProtocolEditor);
  editingProtocolId = null; editingDraft = null;
}
function escCloseProtocolEditor(e){ if(e.key==='Escape') closeProtocolEditor(); }
function addDraftRule(){
  editingDraft.rules.push({id:'r'+(ruleIdCounter++), matchType:'column_name_contains', matchValue:'', action:'MASK'});
  renderProtocolEditorOverlay();
}
function removeDraftRule(rid){
  editingDraft.rules = editingDraft.rules.filter(r=>r.id!==rid);
  renderProtocolEditorOverlay();
}
function updateDraftRule(rid, field, value){
  const r = editingDraft.rules.find(x=>x.id===rid);
  if(r) r[field]=value;
}
function saveDraftProtocol(){
  const nameInput = document.getElementById('draftName');
  editingDraft.name = nameInput.value.trim() || 'Untitled Protocol';
  editingDraft.lastModified = 'Just now';
  const existingIdx = protocolLibrary.findIndex(x=>x.id===editingDraft.id);
  if(existingIdx>=0) protocolLibrary[existingIdx] = editingDraft;
  else protocolLibrary.push(editingDraft);
  log(`Protocol saved: ${editingDraft.name}`);
  closeProtocolEditor();
  renderPrivacySubTab();
}

        <div style="font-size:15px;font-weight:700;">${editingProtocolId? (readonly?'View Protocol':'Edit Protocol') : 'New Protocol'}</div>
        <button class="inspector-close" onclick="closeProtocolEditor()" aria-label="Close protocol editor">✕</button>
      </div>
      <div class="inspector-body">
        <div class="ins-block">
          <div class="ins-label">Name</div>
          <input id="draftName" ${readonly?'disabled':''} value="${esc(editingDraft.name)}" placeholder="e.g. Employee PII"
            style="width:100%;padding:7px 9px;border:1px solid var(--border-strong);border-radius:5px;font-size:13px;">
        </div>
        <div class="ins-block">
          <div class="ins-label">Rules</div>

              <div class="panel" style="padding:10px;">
                <div style="font-size:10.5px;color:var(--text-dim);margin-bottom:6px;">WHEN</div>
                <div style="display:flex;gap:6px;margin-bottom:6px;">
                  <select ${readonly?'disabled':''} class="action-select" style="flex:1;" onchange="updateDraftRule('${r.id}','matchType',this.value)">

                  </select>
                </div>
                ${r.matchType==='sensitivity_label' ? `
                  <select ${readonly?'disabled':''} class="action-select" style="width:100%;margin-bottom:6px;" onchange="updateDraftRule('${r.id}','matchValue',this.value)">
                    ${SENS_LABEL_OPTIONS.map(v=>`<option value="${v}" ${r.matchValue===v?'selected':''}>${v}</option>`).join('')}
                  </select>
                ` : r.matchType==='column_type' ? `
                  <select ${readonly?'disabled':''} class="action-select" style="width:100%;margin-bottom:6px;" onchange="updateDraftRule('${r.id}','matchValue',this.value)">
                    ${['string','number','date'].map(v=>`<option value="${v}" ${r.matchValue===v?'selected':''}>${v}</option>`).join('')}
                  </select>
                ` : r.matchType==='sensitivity_level' ? `
                  <select ${readonly?'disabled':''} class="action-select" style="width:100%;margin-bottom:6px;" onchange="updateDraftRule('${r.id}','matchValue',this.value)">
                    ${['HIGH','MEDIUM','LOW'].map(v=>`<option value="${v}" ${r.matchValue===v?'selected':''}>${v}</option>`).join('')}
                  </select>
                ` : `
                  <input ${readonly?'disabled':''} value="${esc(r.matchValue)}" placeholder="value" style="width:100%;margin-bottom:6px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:4px;font-size:12px;" onchange="updateDraftRule('${r.id}','matchValue',this.value)">
                `}
                <div style="font-size:10.5px;color:var(--text-dim);margin-bottom:6px;">DO</div>
                <div style="display:flex;gap:6px;">
                  <select ${readonly?'disabled':''} class="action-select" style="flex:1;" onchange="updateDraftRule('${r.id}','action',this.value)">

                  </select>
                  ${!readonly? `<button class="btn small" onclick="removeDraftRule('${r.id}')">Remove</button>`:''}
                </div>
              </div>
            `).join('') || '<div class="faint" style="font-size:12px;">No rules yet.</div>'}
          </div>
          ${!readonly? `<button class="btn small" style="margin-top:10px;" onclick="addDraftRule()">+ Add rule</button>`:''}
        </div>

    </div>
  `;
}

const REVIEW_PAGE_SIZE = 10;

function filteredReviewIndices(){

  const q = state.reviewSearch.trim().toLowerCase();
  const indices = [];
  d.rows.forEach((r,i)=>{
    if(!q){ indices.push(i); return; }
    const hay = d.columns.map(c=>String(r[c]||'')).join(' ').toLowerCase();
    if(hay.includes(q)) indices.push(i);
  });
  return indices;
}

  return `

function setQualityDecision(col, decision){
  state.qualityDecisions[col] = decision;
  log(`Data quality decision: ${col} → ${decision}`);

  if(decision==='remove'){

    setView('privacy');
    setTimeout(()=>openColumnInspector(col), 30);
    return;
  }
  renderQuality();
}

function toCSV(rows, cols){
  const esc2 = v => { const s = v===undefined||v===null?'':String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [cols.map(esc2).join(',')];
  rows.forEach(r=> lines.push(cols.map(c=>esc2(r[c])).join(',')));
  return lines.join('\n');
}

function copyAIView(){
  const rows = getExportRowIndices().map(i=>state.protected[i]);
  const csv = toCSV(rows, state.protectedColumns);
  navigator.clipboard.writeText(csv).then(()=>{
    document.getElementById('copyToast').textContent = 'Copied protected dataset to clipboard.';
  }).catch(()=>{
    document.getElementById('copyToast').textContent = 'Copy failed — your browser may block clipboard access here.';
  });
}

function riskScore(){
  const unexpected = state.secondScan.filter(w=>w.unexpected).length;
  const highAllowed = state.secondScan.filter(w=>!w.unexpected && w.severity==='HIGH').length;
  const mediumOrLow = state.secondScan.filter(w=>!w.unexpected && w.severity!=='HIGH').length;
  const failedChecks = (state.verificationChecks||[]).filter(c=>!c.pass).length;

  let level, reasons=[];
  if(unexpected>0 || highAllowed>0 || failedChecks>0){
    level='HIGH';
    if(unexpected>0) reasons.push(`${unexpected} transformed column(s) still match a sensitive pattern`);
    if(highAllowed>0) reasons.push(`${highAllowed} high-sensitivity column(s) left Allowed or under Review`);
    if(failedChecks>0) reasons.push(`${failedChecks} verification check(s) failed`);
  } else if(mediumOrLow>0){
    level='MEDIUM';
    reasons.push(`${mediumOrLow} medium/low-sensitivity column(s) left Allowed or under Review`);
  } else {
    level='LOW';
    reasons.push('No remaining sensitive-pattern matches on the second scan');
    reasons.push('All verification checks passed');
  }
  return {level, reasons};
}
function riskLevel(){ return riskScore().level; }

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportProtected(fmt){
  if(!state.protected) return;
  const base = state.dataset.name.replace(/\.[^.]+$/,'');
  const rows = getExportRowIndices().map(i=>state.protected[i]);
  if(fmt==='csv'){
    download(`${base}_protected.csv`, toCSV(rows, state.protectedColumns), 'text/csv');
  } else if(fmt==='xlsx'){
    exportXLSX(base, rows);
  } else {
    download(`${base}_protected.json`, JSON.stringify(rows, null, 2), 'application/json');
  }
  log(`Dataset exported (${fmt.toUpperCase()}, ${rows.length} row(s))`);
}

function exportXLSX(base, rows){
  if(typeof XLSX === 'undefined'){
    showToast('exportToast', 'XLSX export library did not load — try CSV or JSON instead.');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows || state.protected, {header: state.protectedColumns});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Protected Data');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  download(`${base}_protected.xlsx`, wbout, 'application/octet-stream');
}

function buildQualityReport(){
  return {
    dataset: state.dataset.name,
    rows: state.dataset.rows.length,
    duplicateRows: countDuplicateRows(state.dataset.rows),
    columns: state.columns.map(c=>({
      column: c.name,
      type: c.type,
      missing: c.nulls,
      missingPct: Number(c.nullPct.toFixed(1)),
      uniqueValues: c.unique,
      outliers: c.outlierCount,
      status: (c.nulls>0 || c.outlierCount>0) ? 'Needs review' : 'OK'
    })),
    generatedAt: new Date().toISOString()
  };
}
function exportQualityReport(){
  const base = state.dataset.name.replace(/\.[^.]+$/,'');
  download(`${base}_data_quality_report.json`, JSON.stringify(buildQualityReport(), null, 2), 'application/json');

}

function buildProtocolConfig(){
  return {
    dataset: state.dataset.name,
    columnProtocols: state.protocols,
    generalizeBuckets: state.generalizeBuckets,
    protocolLibrary: protocolLibrary.map(p=>({
      name: p.name, status: p.status, builtin: !!p.builtin, scope: p.scope, rules: p.rules
    })),
    exportedAt: new Date().toISOString()
  };
}

function serializeTokenMaps(){
  const out = {};
  Object.keys(state.tokenMaps).forEach(c=> out[c] = Array.from(state.tokenMaps[c].entries()));
  return out;
}
function deserializeTokenMaps(obj){
  const out = {};
  Object.keys(obj||{}).forEach(c=> out[c] = new Map(obj[c]));
  return out;
}

function saveCurrentAsProject(){
  if(!state.dataset) return;
  const nameInput = document.getElementById('newProjectName');
  const name = (nameInput && nameInput.value.trim()) || state.dataset.name.replace(/\.[^.]+$/,'');
  const project = {
    id: 'proj_'+Date.now(),
    name,
    createdAt: new Date().toISOString(),
    snapshot: {
      dataset: state.dataset,
      columns: state.columns,
      protocols: state.protocols,
      explicitlySet: Array.from(state.explicitlySet),
      generalizeBuckets: state.generalizeBuckets,
      protected: state.protected,
      protectedColumns: state.protectedColumns,
      tokenMaps: serializeTokenMaps(),
      secondScan: state.secondScan,
      verificationChecks: state.verificationChecks,
      audit: state.audit,
      qualityDecisions: state.qualityDecisions
    }
  };
  projects.unshift(project);
  const ok = saveToStorage(PROJECTS_KEY, projects);
  log(`Project saved: ${name}`);
  renderProjects();
  if(!ok) showToast('projectToast', 'Project saved for this session, but browser storage is unavailable, so it will not persist after this tab closes.');
}

function openProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const s = p.snapshot;
  state.dataset = s.dataset;
  state.columns = s.columns;
  state.protocols = s.protocols;
  state.explicitlySet = new Set(s.explicitlySet||[]);
  state.generalizeBuckets = s.generalizeBuckets||{};
  state.protected = s.protected;
  state.protectedColumns = s.protectedColumns||[];
  state.tokenMaps = deserializeTokenMaps(s.tokenMaps);
  state.secondScan = s.secondScan||[];
  state.verificationChecks = s.verificationChecks||[];
  state.audit = s.audit||[];
  state.qualityDecisions = s.qualityDecisions||{};
  // Reset session-only UI state so filters/pagination from whatever you were
  // just looking at don't silently carry over and hide rows in this project.
  state.privacySubTab = 'columns';
  state.reviewPage = 0; state.reviewSearch = ''; state.revealOriginals = false;
  state.aiViewPage = 0; state.aiViewSearch = '';
  state.reportSubTab = 'verify';
  state.dataTable = {search:'', sortCol:null, sortDir:1, page:0, pageSize:50, hiddenCols:new Set(), pinnedCols:new Set(), colWidths:{}, rowFilter:null};
  log(`Project opened: ${p.name}`);
  setView('overview');
  renderTopbar();
}

function deleteProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Delete project "${p.name}"? This can't be undone.`)) return;
  projects = projects.filter(x=>x.id!==id);
  saveToStorage(PROJECTS_KEY, projects);
  renderProjects();
}
